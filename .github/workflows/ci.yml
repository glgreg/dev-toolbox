name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint (JSDoc + ESLint) & Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          node node_modules/esbuild/install.js

      - name: Audit Keystone context graph
        run: .keystone/bin/keystone stone doctor --strict

      - name: Lint JS files via JSDoc & Typecheck
        run: npm run lint:jsdoc

      - name: Lint TS files with ESLint
        run: npm run lint:ts

      - name: Run Unit Tests (Vitest)
        run: npm run test:unit

  e2e:
    name: E2E Browser Tests (Playwright)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Suite
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
